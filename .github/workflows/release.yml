name: Release

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      # Git pushes and release PRs use the app token (steps.app-token), not
      # GITHUB_TOKEN — read suffices here; provenance needs id-token + attestations.
      contents: read
      pull-requests: write
      id-token: write
      attestations: write
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e # v2.0.6
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - run: pnpm quality

      # v2 reads the packages Changesets published from the structured
      # CHANGESETS_OUTPUT file instead of scraping "New tag:" out of stdout.
      # Changesets v3 no longer prints that line, so v1.7.0 silently found no
      # released packages and skipped every tag push and GitHub release from
      # 1.7.0 onwards. v2 also pushes tags and creates releases *before* it
      # honours the publish script's exit code, so a failure in a later publish
      # target can no longer swallow them.
      - name: Create release PR or publish packages
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          commit-message: 'chore: release packages'
          pr-title: 'chore: release packages'
          version-script: pnpm run version
          publish-script: pnpm run release
        env:
          NPM_CONFIG_PROVENANCE: 'true'

      # JSR is a second registry, published after npm and after the tag and
      # GitHub release exist. It runs on its own so a JSR-side failure cannot
      # take the npm release with it, and the script is idempotent so re-running
      # this job is safe.
      - name: Publish to JSR
        if: steps.changesets.outputs.published == 'true'
        run: pnpm jsr:publish
